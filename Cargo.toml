[package]
name = "xilem_telemetry_overlay"
version = "0.1.0"
edition = "2024"

[dependencies]
masonry = "0.4.0"
xilem = "0.4.0"

log = "0.4.27"
flume = "0.11"
futures = "0.3.32"
futures-util = "0.3.32"
tracing = { version = "0.1.44", default-features = false }

[dependencies.compio]
version = "0.18"
features = ["macros", "runtime", "time"]

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Security",
]
